name: CI

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'Interstellar.Client/**'
      - 'Interstellar.sln'
      - 'nuget.config'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'Interstellar.Client/**'
      - 'Interstellar.sln'
      - 'nuget.config'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Client: BepInEx plugin (Windows, net6.0) ──────────────────────
  client:
    if: ${{ !contains(github.event.head_commit.message, 'Update README') }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore Interstellar.Client/Interstellar.Client.csproj

      - name: Build Client
        run: dotnet build Interstellar.Client/Interstellar.Client.csproj -c Release --no-restore

      - name: Collect output
        shell: bash
        run: |
          mkdir -p publish/Plugin
          cp Interstellar.Client/bin/Release/net6.0/Interstellar.Client.dll publish/Plugin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Interstellar.Client
          path: publish/Plugin/

  # ── Release: on tag, create GitHub Release ────────────────────────
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [client]
    runs-on: ubuntu-latest

    steps:
      - name: Download client artifact
        uses: actions/download-artifact@v4
        with:
          name: Interstellar.Client
          path: artifacts/Plugin/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/Plugin/**/*
